<mat-card>
  <mat-card-header><mat-card-title>SOAP / XPath</mat-card-title></mat-card-header>
  <mat-card-content>
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>XPath query</mat-label>
      <input matInput [(ngModel)]="searchTerm" placeholder="e.g. //NotionObjectDto" (keyup.enter)="search()" />
    </mat-form-field>
    <div class="snippets">
      @for (s of xpathSnippets; track s.xpath) {
        <button mat-stroked-button (click)="applySnippet(s.xpath)" [disabled]="loading()">{{ s.label }}</button>
      }
    </div>
    <div class="actions">
      <button mat-raised-button color="primary" (click)="search()" [disabled]="loading()">
        @if (loading()) { <mat-spinner diameter="20" /> } @else { Execute }
      </button>
    </div>

    <mat-checkbox [checked]="simplifiedView()" (change)="simplifiedView.set($event.checked)">Show simplified results</mat-checkbox>

    <app-error [message]="errorMessage" />

    @if (simplifiedView() && simplifiedResponseXml) {
      <app-editor [code]="simplifiedResponseXml" [isReadonly]="true" placeholder="Simplified XML response" minHeight="200px" />
    } @else {
      <app-editor [code]="responseXml" [isReadonly]="true" placeholder="SOAP XML response" minHeight="200px" />
    }
  </mat-card-content>
</mat-card>
