<mat-drawer-container class="layout-container" autosize>
  <mat-drawer #drawer mode="side" opened class="sidenav">
    <mat-toolbar class="sidenav-header">Menu</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active-link" (click)="drawer.close()">
        <mat-icon matListItemIcon>search</mat-icon>
        <span matListItemTitle>Notion Search</span>
      </a>
      <a mat-list-item routerLink="/new" routerLinkActive="active-link" (click)="drawer.close()">
        <mat-icon matListItemIcon>add_circle</mat-icon>
        <span matListItemTitle>Create Page</span>
      </a>
      <a mat-list-item routerLink="/weather" routerLinkActive="active-link" (click)="drawer.close()">
        <mat-icon matListItemIcon>cloud</mat-icon>
        <span matListItemTitle>Weather</span>
      </a>
      <a mat-list-item routerLink="/import" routerLinkActive="active-link" (click)="drawer.close()">
        <mat-icon matListItemIcon>upload_file</mat-icon>
        <span matListItemTitle>Import</span>
      </a>
      <a mat-list-item routerLink="/graphql" routerLinkActive="active-link" (click)="drawer.close()">
        <mat-icon matListItemIcon>code</mat-icon>
        <span matListItemTitle>GraphQL</span>
      </a>
      <a mat-list-item routerLink="/soap" routerLinkActive="active-link" (click)="drawer.close()">
        <mat-icon matListItemIcon>api</mat-icon>
        <span matListItemTitle>SOAP / XPath</span>
      </a>
    </mat-nav-list>
  </mat-drawer>

  <mat-sidenav-content class="content">
    <mat-toolbar class="toolbar">
      <button mat-icon-button (click)="drawer.toggle()" aria-label="Toggle menu">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="app-title">IIS Notion Search</span>
      <span class="toolbar-spacer"></span>

      @if (auth.isAuthenticated()) {
        <div class="profile-section">
          <mat-chip class="role-chip" [class.admin-chip]="auth.isAdmin()">
            {{ auth.isAdmin() ? 'Admin' : 'User' }}
          </mat-chip>
          <span class="username">{{ auth.username() }}</span>
          <button mat-stroked-button color="primary" (click)="signOut()">Sign Out</button>
        </div>
      } @else {
        <button mat-stroked-button color="primary" routerLink="/login">Login</button>
      }
    </mat-toolbar>

    <main class="main-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-drawer-container>
